site_name: libspot
repo_url: https://github.com/asiffer/libspot
repo_name: asiffer/libspot

theme:
  name: shadcn
  katex_options:
    macros:
      "\\KK": "\\mathop{\\mathrm{K}}"

watch:
  - benchmark
  - src
  - include

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - codehilite
  - fenced_code
  - footnotes
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.tab
  - pymdownx.snippets:
      url_download: true
