name: libspot
arch: ${ARCH}
platform: linux
version: ${VERSION} # provided by environment variable
maintainer: Alban Siffer <31479857+asiffer@users.noreply.github.com>
description: |
  C99 library to flag outliers in streaming data. 
  It implements the SPOT algorithm
homepage: https://asiffer.github.io/libspot/
license: LGPL-3.0-or-later
release: ${REVISION} # provided by environment variable, e.g. "1" for "3.0.1"

contents:
  - src: ./dist/libspot.so.${VERSION}
    dst: /usr/lib/libspot.so.${VERSION}
    expand: true
    file_info:
      mode: 0755
  - src: /usr/lib/libspot.so.${VERSION}
    dst: /usr/lib/libspot.so.${MAJOR}
    type: symlink
    expand: true

changelog: changelog.yml

