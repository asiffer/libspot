name: JS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Makefile"
      - "wasm/Makefile"
      - "wasm/*.ts"
      - "wasm/*.c"
      - "src/*.c"
      - "include/*.h"
      - .github/workflows/js.yaml
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write  # Required for OIDC (bun does not support it yet)

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: npmjs
    env:
      # bun publish respects the NPM_CONFIG_TOKEN
      NPM_CONFIG_TOKEN: ${{ secrets.NPMJS_GRANULAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install LLVM & Clang 20
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"

      - name: Generate libspot API (spot.h)
        run: make api

      - name: Install bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install
        working-directory: ./wasm

      - name: Build js library (+types)
        run: make CC=clang-20
        working-directory: ./wasm

      - name: Build npm package
        run: make tgz
        working-directory: ./wasm

      - name: Upload npm package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: libspot-tgz
          path: wasm/libspot*.tgz

      - name: Upload library files as artifact
        uses: actions/upload-artifact@v7
        with:
          path: ./wasm/dist
          name: libspot

      - name: Publish to npmjs
        if: github.ref_type == 'tag'
        run: bun publish
        working-directory: ./wasm

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npmjs
    env:
      # bun publish respects the NPM_CONFIG_TOKEN
      NPM_CONFIG_TOKEN: ${{ secrets.NPMJS_GRANULAR_TOKEN }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: libspot-tgz
      - name: Stage publish
        run: |
          ls -alh --color=auto .
          npm stage publish libspot*.tgz
