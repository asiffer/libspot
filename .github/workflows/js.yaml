name: JS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: npmjs
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPMJS_GRANULAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM & Clang 20
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"

      - name: Generate libspot API (spot.h)
        run: make api

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          registry-url: "https://npm.pkg.github.com/"
          scope: "@asiffer"

      - name: Install dependencies
        run: bun install
        working-directory: ./wasm

      - name: Build js library (+types)
        run: make CC=clang-20
        working-directory: ./wasm

      - name: Build npm package
        run: make tgz
        working-directory: ./wasm

      - name: Upload npm package as artifact
        uses: actions/upload-artifact@v4
        with:
          path: ./wasm/libspot*.tgz
          name: libspot.tgz

      - name: Upload library files as artifact
        uses: actions/upload-artifact@v4
        with:
          path: ./wasm/dist
          name: libspot

      - name: Publish to npmjs
        run: bun publish
        working-directory: ./wasm
